ppo:
  version: v4
  experiment_tag: v4_reference
  total_timesteps: 300000
  n_envs: 4
  learning_rate: 0.0003
  learning_rate_schedule: linear
  n_steps: 256
  batch_size: 256
  n_epochs: 10
  gamma: 0.9752487531
  gae_lambda: 0.95
  clip_range: 0.20
  ent_coef: 0.001
  vf_coef: 0.50
  max_grad_norm: 0.50
  policy_layers: [128, 128]
  normalize_observations: true
  normalize_rewards: true
  clip_observation: 10.0
  clip_reward: 10.0
  eval_frequency: 20000
  validation_episodes: 32
  validation_stress_episodes: 32
  crisis_validation_weight: 0.40
  checkpoint_frequency: 50000
  decision_interval: 5
  stock_action_deadband: 0.03
  futures_action_deadband: 0.03
  option_coverage_deadband: 0.03
  minimum_option_coverage: 0.0
  option_target_smoothing: 1.0
  minimum_stock_weight: 0.25
  maximum_stock_weight: 0.75
  maximum_futures_exposure: 0.50
  stress_training_fraction: 0.50
  margin_call_score_penalty: 5.0
  bankruptcy_score_penalty: 10.0
  maximum_high_cash_fraction: 0.60
  high_cash_score_penalty: 1.0
  minimum_average_stock_weight: 0.10
  stock_shortfall_score_penalty: 2.0
  maximum_turnover: 20.0
  turnover_score_penalty: 0.05
  put_ladder_drawdown_score_penalty: 0.0
  device: auto
