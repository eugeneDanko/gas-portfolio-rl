ppo:
  version: v4
  experiment_tag: v5_long_horizon
  total_timesteps: 200000
  n_envs: 4
  learning_rate: 0.0003
  learning_rate_schedule: linear
  n_steps: 512
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.97
  clip_range: 0.20
